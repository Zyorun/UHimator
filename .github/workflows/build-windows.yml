name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:


# ==========================================
# BUILD JOB
# ==========================================
jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 180


    steps:


    # ==========================================
    # CHECKOUT SOURCE
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # SETUP VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          cmake `
          ninja `
          7zip `
          python `
          -y


    # ==========================================
    # CHECK PROJECT FILE
    # ==========================================
    - name: Detect project
      shell: powershell
      run: |

        Write-Host "Searching project files..."

        Get-ChildItem -Recurse -Name *.pro

        Get-ChildItem -Recurse -Name CMakeLists.txt



    # ==========================================
    # DOWNLOAD DEPENDENCIES
    # ==========================================
    - name: Download dependencies
      shell: powershell
      timeout-minutes: 30
      run: |

        $ErrorActionPreference="Stop"


        if (!(Test-Path deps)) {
            mkdir deps
        }


        cd deps


        if (!(Test-Path libzip-1.9.2.tar.xz)) {

          Write-Host "Downloading libzip..."

          Invoke-WebRequest `
          -Uri "https://libzip.org/download/libzip-1.9.2.tar.xz" `
          -OutFile "libzip-1.9.2.tar.xz" `
          -TimeoutSec 180

        }



    # ==========================================
    # EXTRACT LIBZIP
    # ==========================================
    - name: Extract dependencies
      shell: powershell
      run: |

        cd deps


        7z x libzip-1.9.2.tar.xz -y

        7z x libzip-1.9.2.tar -y



    # ==========================================
    # SETUP QT
    # ==========================================
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:

        version: 5.15.2

        arch: win64_msvc2019_64

        cache: true



    # ==========================================
    # BUILD QT PROJECT
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |

        Write-Host "Finding .pro file..."

        $project = Get-ChildItem `
        -Recurse `
        -Filter *.pro |
        Select-Object -First 1


        if ($null -eq $project) {

          Write-Error "No Qt project (.pro) found"

          exit 1

        }


        Write-Host "Building:"
        Write-Host $project.FullName


        cd $project.Directory


        qmake $project.Name


        nmake



    # ==========================================
    # PACKAGE
    # ==========================================
    - name: Package build
      shell: powershell
      run: |

        mkdir release


        Get-ChildItem -Recurse `
        -Include *.exe |
        Copy-Item `
        -Destination release `
        -Force



    # ==========================================
    # UPLOAD RESULT
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
