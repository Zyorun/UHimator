name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


# ==========================================
# BUILD JOB
# ==========================================
jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 240


    steps:


    # ==========================================
    # CHECKOUT
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          git `
          python `
          cmake `
          ninja `
          7zip `
          msys2 `
          -y


        C:\tools\msys64\usr\bin\bash.exe -lc `
        "pacman -Sy --noconfirm xz"


        echo "C:\tools\msys64\usr\bin" | Out-File `
          -FilePath $env:GITHUB_PATH `
          -Append


        xz --version



    # ==========================================
    # PREPARE DEPENDENCIES
    # ==========================================
    - name: Build dependencies
      shell: powershell
      run: |

        Write-Host "Preparing dependencies..."


        $DevDir = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"


        Write-Host "Developer directory:"
        Write-Host $DevDir


        powershell `
          -ExecutionPolicy Bypass `
          -File ".\Prepare-WindowsDependencies.ps1" `
          -DevDir "$DevDir"



    # ==========================================
    # FIND BUILD SCRIPT
    # ==========================================
    - name: Find build scripts
      shell: powershell
      run: |

        Get-ChildItem `
          -Recurse `
          -File `
          | Where-Object {

              $_.Name -match "build|compile|make"

          } `
          | Select FullName



    # ==========================================
    # BUILD UHIMATOR
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |

        if (Test-Path ".\Build-Windows.ps1") {

          powershell `
            -ExecutionPolicy Bypass `
            -File ".\Build-Windows.ps1"

        }

        elseif (Test-Path ".\build.ps1") {

          powershell `
            -ExecutionPolicy Bypass `
            -File ".\build.ps1"

        }

        elseif (Test-Path ".\build.bat") {

          cmd /c build.bat

        }

        else {

          Write-Error "Build script not found"

          exit 1

        }



    # ==========================================
    # COLLECT OUTPUT
    # ==========================================
    - name: Collect executable
      shell: powershell
      run: |

        mkdir release


        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
