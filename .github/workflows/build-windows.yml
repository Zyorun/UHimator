name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 240


    steps:


    # ==========================================
    # CHECKOUT
    # ==========================================
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # SETUP VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL REQUIREMENTS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          git `
          python `
          cmake `
          ninja `
          7zip `
          -y



    # ==========================================
    # FIND BUILD SCRIPT
    # ==========================================
    - name: Find build scripts
      shell: powershell
      run: |

        Write-Host "Searching scripts..."

        Get-ChildItem `
          -Recurse `
          -File `
          | Where-Object {

              $_.Name -match "build|compile|prepare|dependencies"

          } `
          | Select FullName



    # ==========================================
    # BUILD DEPENDENCIES
    # ==========================================
    - name: Build dependencies
      shell: powershell
      run: |

        if (Test-Path ".\scripts\Prepare-WindowsDependencies.ps1") {

          Write-Host "Running dependency script"

          powershell `
          -ExecutionPolicy Bypass `
          -File ".\scripts\Prepare-WindowsDependencies.ps1"

        }

        elseif (Test-Path ".\Prepare-WindowsDependencies.ps1") {

          Write-Host "Running dependency script"

          powershell `
          -ExecutionPolicy Bypass `
          -File ".\Prepare-WindowsDependencies.ps1"

        }

        else {

          Write-Host "No dependency script found"

        }



    # ==========================================
    # BUILD PROJECT
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |


        if (Test-Path ".\scripts\build-windows.ps1") {


          powershell `
          -ExecutionPolicy Bypass `
          -File ".\scripts\build-windows.ps1"


        }


        elseif (Test-Path ".\build-windows.ps1") {


          powershell `
          -ExecutionPolicy Bypass `
          -File ".\build-windows.ps1"


        }


        else {


          Write-Host "Searching executable build file"


          Get-ChildItem `
          -Recurse `
          -File `
          | Where-Object {

              $_.Extension -eq ".bat" `
              -or $_.Extension -eq ".cmd" `
              -or $_.Extension -eq ".ps1"

          }


          exit 1


        }



    # ==========================================
    # COLLECT OUTPUT
    # ==========================================
    - name: Collect executable
      shell: powershell
      run: |

        mkdir release


        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
