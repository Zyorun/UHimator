name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 240


    steps:


    # ==========================================
    # CHECKOUT
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # MSVC
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          git `
          python `
          cmake `
          ninja `
          7zip `
          -y


        Write-Host "Tools ready"


        git --version

        cmake --version

        ninja --version

        7z



    # ==========================================
    # PATCH DEPENDENCY SCRIPT
    # ==========================================
    - name: Patch dependency extractor
      shell: powershell
      run: |

        Write-Host "Patching Prepare-WindowsDependencies.ps1"


        $file = ".\Prepare-WindowsDependencies.ps1"


        if (!(Test-Path $file)) {

          Write-Error "Prepare script missing"

          exit 1

        }


        Copy-Item `
          $file `
          "$file.backup"



        (Get-Content $file) `
        | ForEach-Object {

            $_ -replace `
            "tar\.exe", `
            "7z"

        } `
        | Set-Content $file



        Write-Host "Patch complete"



    # ==========================================
    # PREPARE DEPENDENCIES
    # ==========================================
    - name: Build dependencies
      shell: powershell
      timeout-minutes: 60
      run: |

        Write-Host "Preparing dependencies..."


        $DevDir = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"


        powershell `
          -ExecutionPolicy Bypass `
          -File ".\Prepare-WindowsDependencies.ps1" `
          -DevDir "$DevDir"



    # ==========================================
    # SEARCH OUTPUT
    # ==========================================
    - name: Check files
      shell: powershell
      run: |

        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File



    # ==========================================
    # BUILD
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |

        if (Test-Path ".\Build-Windows.ps1") {

          powershell `
            -ExecutionPolicy Bypass `
            -File ".\Build-Windows.ps1"

        }

        elseif (Test-Path ".\build.ps1") {

          powershell `
            -ExecutionPolicy Bypass `
            -File ".\build.ps1"

        }

        elseif (Test-Path ".\build.bat") {

          cmd /c build.bat

        }

        else {

          Write-Host "No build script found"

          exit 1

        }



    # ==========================================
    # PACKAGE
    # ==========================================
    - name: Package
      shell: powershell
      run: |

        mkdir release


        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD
    # ==========================================
    - name: Upload
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
