name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


# ==========================================
# BUILD JOB
# ==========================================
jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 240


    steps:


    # ==========================================
    # CHECKOUT SOURCE
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # SETUP VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          git `
          python `
          cmake `
          ninja `
          7zip `
          msys2 `
          -y


        Write-Host "Installing xz using MSYS2..."


        C:\tools\msys64\usr\bin\bash.exe -lc `
          "pacman -Sy --noconfirm xz"



        Write-Host "Searching xz.exe..."


        $xz = Get-ChildItem `
          "C:\tools\msys64" `
          -Recurse `
          -Filter "xz.exe" `
          -ErrorAction SilentlyContinue `
          | Select-Object -First 1



        if ($null -eq $xz) {

          Write-Error "xz.exe not found"

          exit 1

        }



        Write-Host "Found xz:"
        Write-Host $xz.FullName



        echo $xz.Directory.FullName | Out-File `
          -FilePath $env:GITHUB_PATH `
          -Append



        Write-Host "Testing xz..."

        & $xz.FullName --version



    # ==========================================
    # PREPARE DEPENDENCIES
    # ==========================================
    - name: Build dependencies
      shell: powershell
      run: |

        Write-Host "Preparing dependencies..."


        $DevDir = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"



        Write-Host "Developer directory:"
        Write-Host $DevDir



        if (!(Test-Path ".\Prepare-WindowsDependencies.ps1")) {

          Write-Error "Prepare-WindowsDependencies.ps1 not found"

          exit 1

        }



        powershell `
          -ExecutionPolicy Bypass `
          -File ".\Prepare-WindowsDependencies.ps1" `
          -DevDir "$DevDir"



    # ==========================================
    # FIND BUILD SCRIPT
    # ==========================================
    - name: Find build scripts
      shell: powershell
      run: |

        Write-Host "Searching build scripts..."


        Get-ChildItem `
          -Recurse `
          -File `
          | Where-Object {

              $_.Name -match "build|compile|make"

          } `
          | Select-Object FullName



    # ==========================================
    # BUILD UHIMATOR
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |


        if (Test-Path ".\Build-Windows.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\Build-Windows.ps1"


        }

        elseif (Test-Path ".\build.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\build.ps1"


        }

        elseif (Test-Path ".\build.bat") {


          cmd /c build.bat


        }

        else {


          Write-Error "Build script not found"


          Get-ChildItem `
            -Recurse `
            -File `
            | Where-Object {

                $_.Extension -eq ".ps1" `
                -or $_.Extension -eq ".bat" `
                -or $_.Extension -eq ".cmd"

            } `
            | Select-Object FullName


          exit 1

        }



    # ==========================================
    # COLLECT OUTPUT
    # ==========================================
    - name: Collect executable
      shell: powershell
      run: |

        New-Item `
          -ItemType Directory `
          -Force `
          -Path release


        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD ARTIFACT
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
