name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:


# ==========================================
# BUILD JOB
# ==========================================
jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 180


    steps:


    # ==========================================
    # CHECKOUT SOURCE
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # SETUP VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          7zip `
          python `
          ninja `
          cmake `
          -y



    # ==========================================
    # INSTALL QT
    # ==========================================
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:

        version: 5.15.2

        arch: win64_msvc2019_64

        cache: true



    # ==========================================
    # CHECK PROJECT STRUCTURE
    # ==========================================
    - name: Detect project files
      shell: powershell
      run: |

        Write-Host "=================================="
        Write-Host "Current Directory"
        Write-Host "=================================="


        pwd


        Write-Host ""
        Write-Host "=================================="
        Write-Host "Searching project files"
        Write-Host "=================================="


        $files = Get-ChildItem `
          -Path . `
          -Recurse `
          -File `
          -ErrorAction SilentlyContinue `
          | Where-Object {

              $_.Name -eq "CMakeLists.txt" `
              -or $_.Extension -eq ".pro" `
              -or $_.Extension -eq ".pri"

          }


        if ($files.Count -eq 0) {

          Write-Error "No project file found"

          exit 1

        }


        foreach ($file in $files) {

          Write-Host $file.FullName

        }



    # ==========================================
    # BUILD PROJECT
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |


        Write-Host "Searching Qt project..."


        $pro = Get-ChildItem `
          -Path . `
          -Recurse `
          -File `
          -Filter *.pro `
          -ErrorAction SilentlyContinue `
          | Select-Object -First 1



        if ($null -ne $pro) {


          Write-Host "=================================="

          Write-Host "Qt project detected"

          Write-Host $pro.FullName

          Write-Host "=================================="


          cd $pro.Directory.FullName


          qmake $pro.Name


          nmake


        }

        else {


          Write-Host "No Qt project found"

          Write-Host "Searching CMake project..."


          $cmake = Get-ChildItem `
            -Path . `
            -Recurse `
            -File `
            -Filter CMakeLists.txt `
            -ErrorAction SilentlyContinue `
            | Select-Object -First 1



          if ($null -eq $cmake) {


            Write-Error "No CMakeLists.txt or .pro found"


            exit 1


          }



          Write-Host "CMake project detected"

          Write-Host $cmake.FullName



          mkdir build


          cd build


          cmake $cmake.Directory.FullName `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release



          ninja -v


        }



    # ==========================================
    # COLLECT EXE
    # ==========================================
    - name: Collect build files
      shell: powershell
      run: |


        mkdir release


        Get-ChildItem `
          -Path . `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD RESULT
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
