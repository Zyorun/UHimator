name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


# ==========================================
# BUILD JOB
# ==========================================
jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 240


    steps:


    # ==========================================
    # CHECKOUT SOURCE
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # SETUP VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL BUILD TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          git `
          python `
          cmake `
          ninja `
          7zip `
          -y


        Write-Host "Installing xz..."


        Invoke-WebRequest `
          -Uri "https://github.com/madler/xz/releases/download/v5.8.1/xz-5.8.1-windows-x86_64.zip" `
          -OutFile "xz.zip"


        Expand-Archive `
          xz.zip `
          -DestinationPath "C:\xz" `
          -Force


        Get-ChildItem `
          C:\xz `
          -Recurse



    # ==========================================
    # ADD XZ TO PATH
    # ==========================================
    - name: Setup xz path
      shell: powershell
      run: |

        $xz = Get-ChildItem `
          C:\xz `
          -Recurse `
          -Filter xz.exe `
          | Select-Object -First 1


        if ($null -eq $xz) {

          Write-Error "xz.exe not found"

          exit 1

        }


        Write-Host "Found xz:"
        Write-Host $xz.FullName


        echo $xz.Directory.FullName | Out-File `
          -FilePath $env:GITHUB_PATH `
          -Append


        & $xz.FullName --version



    # ==========================================
    # PREPARE DEPENDENCIES
    # ==========================================
    - name: Build dependencies
      shell: powershell
      run: |

        Write-Host "Preparing dependencies..."


        $DevDir = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"


        Write-Host "Developer directory:"
        Write-Host $DevDir



        if (!(Test-Path ".\Prepare-WindowsDependencies.ps1")) {

          Write-Error "Prepare-WindowsDependencies.ps1 not found"

          exit 1

        }



        powershell `
          -ExecutionPolicy Bypass `
          -File ".\Prepare-WindowsDependencies.ps1" `
          -DevDir "$DevDir"



    # ==========================================
    # FIND BUILD FILE
    # ==========================================
    - name: Find build script
      shell: powershell
      run: |

        Write-Host "Searching build scripts..."


        Get-ChildItem `
          -Recurse `
          -File `
          | Where-Object {

              $_.Name -match "build|compile|make"

          } `
          | Select FullName



    # ==========================================
    # BUILD UHIMATOR
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |


        if (Test-Path ".\Build-Windows.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\Build-Windows.ps1"


        }

        elseif (Test-Path ".\build.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\build.ps1"


        }

        elseif (Test-Path ".\build.bat") {


          cmd /c build.bat


        }

        else {


          Write-Host "No build script found"


          Get-ChildItem `
            -Recurse `
            -File `
            | Where-Object {

                $_.Extension -eq ".ps1" `
                -or $_.Extension -eq ".bat" `
                -or $_.Extension -eq ".cmd"

            } `
            | Select FullName


          exit 1

        }



    # ==========================================
    # COLLECT OUTPUT
    # ==========================================
    - name: Collect executable
      shell: powershell
      run: |

        mkdir release


        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD ARTIFACT
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
