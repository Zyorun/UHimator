name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-2022
    timeout-minutes: 180

    steps:

    # ==========================================
    # CHECKOUT
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ==========================================
    # SETUP COMPILER
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # ==========================================
    # INSTALL TOOLS
    # ==========================================
    - name: Install dependencies
      shell: powershell
      run: |
        choco install cmake ninja 7zip python wget -y
        git config --global core.autocrlf false

    # ==========================================
    # CACHE
    # ==========================================
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          deps
          build
          C:\Qt
        key: windows-uhimator-${{ hashFiles('**/*.cpp','**/*.h','**/*.pro') }}

    # ==========================================
    # DOWNLOAD LIBZIP
    # ==========================================
    - name: Download libzip
      shell: powershell
      timeout-minutes: 20
      run: |
        $ErrorActionPreference="Stop"

        New-Item -ItemType Directory -Force -Path deps

        cd deps

        if (!(Test-Path "libzip-1.9.2.tar.xz")) {
          Write-Host "Downloading libzip..."

          Invoke-WebRequest `
            -Uri "https://libzip.org/download/libzip-1.9.2.tar.xz" `
            -OutFile "libzip-1.9.2.tar.xz" `
            -TimeoutSec 180
        }

    # ==========================================
    # EXTRACT
    # ==========================================
    - name: Extract libzip
      shell: powershell
      run: |
        cd deps

        7z x libzip-1.9.2.tar.xz -y
        7z x libzip-1.9.2.tar -y

    # ==========================================
    # CONFIGURE
    # ==========================================
    - name: Configure CMake
      shell: powershell
      run: |
        mkdir build
        cd build

        cmake .. `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release

    # ==========================================
    # BUILD
    # ==========================================
    - name: Compile UHimator
      shell: powershell
      timeout-minutes: 90
      run: |
        cd build
        ninja -v

    # ==========================================
    # UPLOAD
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UHimator-Windows
        path: build/
