name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


# ==========================================
# BUILD JOB
# ==========================================
jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 240


    steps:


    # ==========================================
    # CHECKOUT SOURCE
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # SETUP VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          git `
          python `
          cmake `
          ninja `
          7zip `
          -y


        Write-Host "Checking tools..."

        git --version

        cmake --version

        ninja --version

        7z



    # ==========================================
    # PATCH DEPENDENCY SCRIPT
    # ==========================================
    - name: Patch dependency extractor
      shell: powershell
      run: |

        Write-Host "Patching dependency script..."


        $file = ".\Prepare-WindowsDependencies.ps1"



        if (!(Test-Path $file)) {

          Write-Error "Prepare-WindowsDependencies.ps1 not found"

          exit 1

        }



        Copy-Item `
          $file `
          "$file.backup"



        $content = Get-Content $file -Raw



        # tar.exe -> 7z.exe
        $content = $content `
          -replace "tar\.exe", "7z"



        # tar syntax -> 7zip syntax
        $content = $content `
          -replace "-xf", "x"



        Set-Content `
          -Path $file `
          -Value $content



        Write-Host "Patch finished"



        Write-Host "Patched command check:"

        Select-String `
          -Path $file `
          -Pattern "7z|tar"



    # ==========================================
    # BUILD DEPENDENCIES
    # ==========================================
    - name: Build dependencies
      shell: powershell
      timeout-minutes: 60
      run: |

        Write-Host "Preparing dependencies..."



        $DevDir = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"



        Write-Host "Developer directory:"
        Write-Host $DevDir



        powershell `
          -ExecutionPolicy Bypass `
          -File ".\Prepare-WindowsDependencies.ps1" `
          -DevDir "$DevDir"



    # ==========================================
    # FIND BUILD FILE
    # ==========================================
    - name: Find build scripts
      shell: powershell
      run: |

        Write-Host "Searching build scripts..."


        Get-ChildItem `
          -Recurse `
          -File `
          | Where-Object {

              $_.Extension -eq ".ps1" `
              -or $_.Extension -eq ".bat" `
              -or $_.Extension -eq ".cmd"

          } `
          | Select FullName



    # ==========================================
    # BUILD UHIMATOR
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |


        if (Test-Path ".\Build-Windows.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\Build-Windows.ps1"


        }


        elseif (Test-Path ".\build.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\build.ps1"


        }


        elseif (Test-Path ".\build.bat") {


          cmd /c build.bat


        }


        else {


          Write-Error "Build script not found"

          exit 1

        }



    # ==========================================
    # COLLECT OUTPUT
    # ==========================================
    - name: Collect executable
      shell: powershell
      run: |

        New-Item `
          -ItemType Directory `
          -Force `
          -Path release



        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
