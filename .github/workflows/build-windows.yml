name: Build UHimator Windows

# ==========================================
# WORKFLOW TRIGGER
# ==========================================
on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:


# ==========================================
# BUILD JOB
# ==========================================
jobs:

  build-windows:

    name: Build UHimator

    runs-on: windows-2022

    timeout-minutes: 240


    steps:


    # ==========================================
    # CHECKOUT SOURCE
    # ==========================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive



    # ==========================================
    # SETUP VISUAL STUDIO
    # ==========================================
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1



    # ==========================================
    # INSTALL TOOLS
    # ==========================================
    - name: Install tools
      shell: powershell
      run: |

        choco install `
          git `
          python `
          cmake `
          ninja `
          7zip `
          -y



    # ==========================================
    # PREPARE WINDOWS DEPENDENCIES
    # ==========================================
    - name: Build dependencies
      shell: powershell
      run: |

        Write-Host "Preparing dependencies..."


        $DevDir = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"


        Write-Host "Developer directory:"
        Write-Host $DevDir


        if (Test-Path ".\Prepare-WindowsDependencies.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\Prepare-WindowsDependencies.ps1" `
            -DevDir "$DevDir"


        }

        elseif (Test-Path ".\scripts\Prepare-WindowsDependencies.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\scripts\Prepare-WindowsDependencies.ps1" `
            -DevDir "$DevDir"


        }

        else {

          Write-Error "Prepare-WindowsDependencies.ps1 not found"

          exit 1

        }



    # ==========================================
    # FIND BUILD SCRIPT
    # ==========================================
    - name: Find build script
      shell: powershell
      run: |

        Write-Host "Searching build files..."


        Get-ChildItem `
          -Recurse `
          -File `
          | Where-Object {

            $_.Name -match "build|compile|make"

          } `
          | Select FullName



    # ==========================================
    # BUILD UHIMATOR
    # ==========================================
    - name: Build UHimator
      shell: powershell
      run: |


        if (Test-Path ".\Build-Windows.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\Build-Windows.ps1"


        }

        elseif (Test-Path ".\build.ps1") {


          powershell `
            -ExecutionPolicy Bypass `
            -File ".\build.ps1"


        }

        elseif (Test-Path ".\build.bat") {


          cmd /c build.bat


        }

        else {


          Write-Host "No build script detected"


          Write-Host "Available scripts:"


          Get-ChildItem `
            -Recurse `
            -File `
            | Where-Object {

              $_.Extension -eq ".ps1" `
              -or $_.Extension -eq ".bat" `
              -or $_.Extension -eq ".cmd"

            } `
            | Select FullName


          exit 1


        }



    # ==========================================
    # COLLECT RESULT
    # ==========================================
    - name: Collect executable
      shell: powershell
      run: |

        mkdir release


        Get-ChildItem `
          -Recurse `
          -Include *.exe `
          -File `
          | Copy-Item `
          -Destination release `
          -Force



    # ==========================================
    # UPLOAD ARTIFACT
    # ==========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: UHimator-Windows

        path: release/
